name: Generate contribution animation

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-animation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: 0xdowz
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23C7FF2F&color_dots=%23070B0E,%230E1A18,%2319362F,%232A5A4C,%23C7FF2F
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23C7FF2F&color_dots=%23070B0E,%230E1A18,%2319362F,%232A5A4C,%23C7FF2F

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
